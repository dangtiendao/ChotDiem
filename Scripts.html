<script>
/**
 * ==========================================================================
 * Scripts.html - Frontend Application Logic, Central State & GasClient Adapter
 * Google Apps Script Web App (Mobile First) - Phase 5 Complete
 * ==========================================================================
 */

// Central Application Reactive State
const appState = {
  currentView: 'scoreboard',
  session: {
    appName: 'Chốt Điểm',
    slogan: 'Chạm nhanh, tính chuẩn, vui trọn cuộc chơi.',
    sessionId: '',
    sessionName: 'Phiên chơi',
    defaultBet: 5,
    timezone: 'Asia/Ho_Chi_Minh',
    schemaVersion: '1.0.0'
  },
  players: [],
  scoreboard: [],
  history: [],
  recentGames: [],
  latestGameNumber: 0,
  lastSyncedAt: null,
  historyFilters: {
    playerId: '',
    leaderId: '',
    result: 'ALL',
    status: 'HOP_LE',
    fromGameNumber: '',
    toGameNumber: '',
    isPanelOpen: false
  },
  newGame: {
    leaderId: null,
    defaultBet: 5,
    customBets: {}, // { [playerId]: number }
    results: {},    // { [playerId]: 'WIN' | 'DRAW' | 'LOSE' }
    note: '',
    editingBet: false,
    editingCustomBetId: null
  },
  editingGame: {
    gameId: null,
    gameNumber: null,
    leaderId: null,
    defaultBet: 5,
    customBets: {},
    results: {},
    note: ''
  },
  quickUndo: {
    active: false,
    gameId: null,
    gameNumber: null,
    timerId: null,
    intervalId: null,
    remainingSeconds: 8
  },
  loading: {
    app: true,
    scoreboard: false,
    newGame: false,
    history: false,
    players: false,
    settings: false,
    detailModal: false,
    refreshing: false
  },
  isSubmitting: false,
  errors: {}
};

// ==========================================================================
// 1. GasClient (Centralized Google Apps Script Runner & Mock Fallback)
// ==========================================================================
const GasClient = {
  call(functionName, ...args) {
    return new Promise((resolve, reject) => {
      const timeoutMs = 25000;
      let timedOut = false;

      const timer = setTimeout(() => {
        timedOut = true;
        const err = new Error('Yêu cầu tới máy chủ bị quá thời gian (Timeout). Vui lòng kiểm tra kết nối mạng và thử lại.');
        err.code = 'TIMEOUT';
        reject(err);
      }, timeoutMs);

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((response) => {
            if (timedOut) return;
            clearTimeout(timer);

            if (response && response.ok === false) {
              const err = new Error(response.message || (response.error ? response.error.message : 'Đã xảy ra lỗi máy chủ'));
              err.code = response.errorCode || (response.error ? response.error.code : 'UNKNOWN_ERROR');
              err.details = response.error ? response.error.details : null;
              err.meta = response.meta || null;
              reject(err);
            } else {
              resolve(response ? response.data : null);
            }
          })
          .withFailureHandler((error) => {
            if (timedOut) return;
            clearTimeout(timer);
            console.error(`[GasClient Error] ${functionName}:`, error);
            const err = new Error(error.message || 'Lỗi kết nối máy chủ Google Apps Script. Vui lòng thử lại.');
            err.code = 'NETWORK_ERROR';
            reject(err);
          })[functionName](...args);
      } else {
        // Standalone browser / local fallback mock
        console.warn(`[Mock API] google.script.run not available. Simulating: ${functionName}`);
        setTimeout(() => {
          if (timedOut) return;
          clearTimeout(timer);
          resolve(mockApiResponse(functionName, args));
        }, 300);
      }
    });
  }
};

// Aliases for compatibility
const apiClient = GasClient;

/**
 * Generates a unique client request ID (UUID fallback)
 */
function generateClientRequestId() {
  if (typeof window !== 'undefined' && window.crypto && window.crypto.randomUUID) {
    return window.crypto.randomUUID();
  }
  return 'REQ-' + Date.now() + '-' + Math.random().toString(36).substring(2, 9);
}

// ==========================================================================
// 2. Application Bootstrap & Refresh Lifecycle (Task 5.1, 5.2, 5.3)
// ==========================================================================
document.addEventListener('DOMContentLoaded', () => {
  initNavigation();
  bootstrapApp();
});

/**
 * High-speed Bootstrap API (1 Roundtrip to initialize entire app)
 */
async function bootstrapApp() {
  const splashEl = document.getElementById('splash-screen');
  const splashLoader = document.getElementById('splash-loader');
  const splashErrBox = document.getElementById('splash-error-box');
  const splashErrText = document.getElementById('splash-error-text');

  try {
    if (splashLoader) splashLoader.style.display = 'block';
    if (splashErrBox) splashErrBox.style.display = 'none';

    appState.loading.app = true;
    const data = await GasClient.call('getAppBootstrapData');

    if (data) {
      if (data.session) Object.assign(appState.session, data.session);
      if (data.players) appState.players = data.players;
      if (data.scoreboard) appState.scoreboard = data.scoreboard;
      if (data.recentGames) appState.recentGames = data.recentGames;
      if (typeof data.latestGameNumber === 'number') appState.latestGameNumber = data.latestGameNumber;

      // Set default bet from session
      appState.newGame.defaultBet = appState.session.defaultBet || 5;

      // Update sync time
      appState.lastSyncedAt = new Date();
      updateSyncTimeLabel();

      // Render all views
      renderHeader();
      renderScoreboard();
      renderNewGameStep1Leader();
      renderNewGameStep2Bet();
      renderNewGameStep3Opponents();
      renderNewGameStep5Preview();
      renderPlayersList();
      renderSettings();
      populateHistoryFilterOptions();
    }

    // Hide Splash Screen smoothly
    if (splashEl) {
      splashEl.classList.add('splash-screen--hidden');
      setTimeout(() => {
        splashEl.style.display = 'none';
      }, 450);
    }
  } catch (err) {
    console.error('[bootstrapApp] Failure:', err);
    if (splashLoader) splashLoader.style.display = 'none';
    if (splashErrBox) splashErrBox.style.display = 'flex';
    if (splashErrText) splashErrText.textContent = err.message || 'Không thể kết nối đến máy chủ.';
    showToast(`Lỗi khởi tạo: ${err.message}`, 'danger');
  } finally {
    appState.loading.app = false;
  }
}

/**
 * Handles manual sync / refresh button click
 */
async function handleManualRefresh() {
  await refreshAppData(true);
}

/**
 * Refreshes data from backend without full page reload
 */
async function refreshAppData(showSuccessToast = false) {
  const btnRefresh = document.getElementById('btn-refresh');
  if (appState.loading.refreshing) return;

  try {
    appState.loading.refreshing = true;
    if (btnRefresh) btnRefresh.classList.add('is-spinning');

    const data = await GasClient.call('getAppBootstrapData');

    if (data) {
      if (data.session) Object.assign(appState.session, data.session);
      if (data.players) appState.players = data.players;
      if (data.scoreboard) appState.scoreboard = data.scoreboard;
      if (data.recentGames) appState.recentGames = data.recentGames;
      if (typeof data.latestGameNumber === 'number') appState.latestGameNumber = data.latestGameNumber;

      appState.lastSyncedAt = new Date();
      updateSyncTimeLabel();

      renderHeader();
      renderScoreboard();
      renderPlayersList();
      populateHistoryFilterOptions();

      // If on history view, refresh history
      if (appState.currentView === 'history') {
        loadHistory(false);
      }

      // If on new game view, refresh available players without resetting leader if still valid
      if (appState.currentView === 'new-game') {
        renderNewGameStep1Leader();
        renderNewGameStep3Opponents();
        renderNewGameStep5Preview();
      }

      if (showSuccessToast) {
        showToast('Đã đồng bộ dữ liệu mới nhất.', 'success');
      }
    }
  } catch (err) {
    console.error('[refreshAppData] Error:', err);
    showToast(`Không thể đồng bộ: ${err.message}`, 'danger');
  } finally {
    appState.loading.refreshing = false;
    if (btnRefresh) {
      setTimeout(() => btnRefresh.classList.remove('is-spinning'), 400);
    }
  }
}

/**
 * Updates the top bar sync timestamp label
 */
function updateSyncTimeLabel() {
  const lbl = document.getElementById('sync-time-label');
  if (!lbl) return;
  if (!appState.lastSyncedAt) {
    lbl.textContent = 'Đồng bộ: --:--';
    return;
  }
  const d = appState.lastSyncedAt;
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  lbl.textContent = `Đồng bộ: ${hh}:${mm}`;
}

// ==========================================================================
// 3. Navigation Management
// ==========================================================================
function initNavigation() {
  const navButtons = document.querySelectorAll('.app-nav .nav-item');
  navButtons.forEach((btn) => {
    btn.addEventListener('click', (e) => {
      const viewName = btn.getAttribute('data-view');
      if (viewName) {
        navigateTo(viewName);
      }
    });
  });
}

function navigateTo(viewName) {
  if (!viewName || appState.currentView === viewName) return;

  document.querySelectorAll('.view').forEach((v) => {
    v.classList.remove('view--active');
  });

  const targetView = document.getElementById(`view-${viewName}`);
  if (targetView) {
    targetView.classList.add('view--active');
    appState.currentView = viewName;
  }

  document.querySelectorAll('.app-nav .nav-item').forEach((btn) => {
    if (btn.getAttribute('data-view') === viewName) {
      btn.classList.add('nav-item--active');
    } else {
      btn.classList.remove('nav-item--active');
    }
  });

  window.scrollTo({ top: 0, behavior: 'smooth' });

  if (viewName === 'scoreboard') {
    renderScoreboard();
  } else if (viewName === 'new-game') {
    renderNewGameStep1Leader();
    renderNewGameStep2Bet();
    renderNewGameStep3Opponents();
    renderNewGameStep5Preview();
  } else if (viewName === 'history') {
    loadHistory(true);
  } else if (viewName === 'players') {
    renderPlayersList();
  } else if (viewName === 'settings') {
    renderSettings();
  }
}

// ==========================================================================
// 4. Header & Settings Rendering
// ==========================================================================
function renderHeader() {
  const badge = document.getElementById('session-badge');
  if (badge) {
    badge.textContent = appState.session.sessionName || 'Phiên chơi';
  }
}

function renderSettings() {
  const nameEl = document.getElementById('setting-session-name');
  const betEl = document.getElementById('setting-default-bet');
  if (nameEl) nameEl.textContent = appState.session.sessionName || '--';
  if (betEl) betEl.textContent = appState.session.defaultBet || 5;
}

// ==========================================================================
// 5. Scoreboard Screen (View 1)
// ==========================================================================
function renderScoreboard() {
  const container = document.getElementById('scoreboard-container');
  if (!container) return;

  const list = appState.scoreboard || [];

  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">🏆</div>
        <div class="empty-state__title">Chưa Có Bảng Điểm</div>
        <div class="empty-state__description">Chốt ván đầu tiên để bắt đầu ghi nhận điểm số của phiên chơi.</div>
        <button type="button" class="btn-secondary" style="margin-top: 14px;" onclick="navigateTo('new-game')">
          + Bắt đầu Ván mới
        </button>
      </div>
    `;
    return;
  }

  let html = '<div class="scoreboard-list">';
  list.forEach((p, idx) => {
    const isTop1 = p.rank === 1;
    const isTop2 = p.rank === 2;
    const isTop3 = p.rank === 3;

    let rankBadgeClass = 'rank-badge--other';
    if (isTop1) rankBadgeClass = 'rank-badge--1';
    else if (isTop2) rankBadgeClass = 'rank-badge--2';
    else if (isTop3) rankBadgeClass = 'rank-badge--3';

    let scoreClass = 'score-neutral';
    let scorePrefix = '';
    if (p.totalScore > 0) {
      scoreClass = 'score-win';
      scorePrefix = '+';
    } else if (p.totalScore < 0) {
      scoreClass = 'score-lose';
    }

    const leaderBadge = p.leaderCount > 0 ? `<span class="player-role-badge">A x${p.leaderCount}</span>` : '';
    const inactiveTag = !p.active ? `<span class="badge-status badge-status--cancelled" style="margin-left: 4px;">Nghỉ</span>` : '';

    html += `
      <div class="scoreboard-item card">
        <div class="scoreboard-item__rank">
          <div class="rank-badge ${rankBadgeClass}">#${p.rank}</div>
        </div>
        <div class="scoreboard-item__info">
          <div class="scoreboard-item__name">
            <span>${escapeHtml(p.name)}</span>
            ${leaderBadge}
            ${inactiveTag}
          </div>
          <div class="scoreboard-item__stats">
            <span>Ván: <b>${p.gamesPlayed}</b></span>
            <span>•</span>
            <span style="color: var(--color-win);">Thắng: ${p.winCount}</span>
            <span>•</span>
            <span style="color: var(--color-lose);">Thua: ${p.loseCount}</span>
            <span>•</span>
            <span>Hòa: ${p.drawCount}</span>
          </div>
        </div>
        <div class="scoreboard-item__score ${scoreClass}">
          ${scorePrefix}${p.totalScore}
        </div>
      </div>
    `;
  });
  html += '</div>';

  container.innerHTML = html;
}

// ==========================================================================
// 6. New Game Screen (View 2 - 6 Steps)
// ==========================================================================
function renderNewGameStep1Leader() {
  const container = document.getElementById('step-leader-list');
  if (!container) return;

  const activePlayers = (appState.players || []).filter((p) => p.active !== false);

  if (activePlayers.length === 0) {
    container.innerHTML = `
      <div style="grid-column: 1 / -1; font-size: 0.85rem; color: var(--text-muted); padding: 10px 0;">
        Chưa có người chơi hoạt động. Vui lòng thêm người chơi ở tab <b>Người chơi</b>.
      </div>
    `;
    return;
  }

  let html = '';
  activePlayers.forEach((p) => {
    const isSelected = appState.newGame.leaderId === p.playerId;
    html += `
      <button type="button" class="leader-chip ${isSelected ? 'leader-chip--selected' : ''}" onclick="selectLeader('${p.playerId}')">
        <span>${escapeHtml(p.name)}</span>
        ${isSelected ? '<span class="leader-chip__badge">Cầm đầu A</span>' : ''}
      </button>
    `;
  });

  container.innerHTML = html;
}

function selectLeader(playerId) {
  if (appState.newGame.leaderId === playerId) return;
  appState.newGame.leaderId = playerId;

  delete appState.newGame.results[playerId];
  delete appState.newGame.customBets[playerId];

  renderNewGameStep1Leader();
  renderNewGameStep3Opponents();
  renderNewGameStep5Preview();
}

function renderNewGameStep2Bet() {
  const container = document.getElementById('step-default-bet-container');
  if (!container) return;

  const bet = appState.newGame.defaultBet || 5;

  container.innerHTML = `
    <div class="bet-bar">
      <span class="bet-bar__label">Cược mặc định:</span>
      <div class="bet-quick-group">
        <button type="button" class="btn-bet-chip ${bet === 5 ? 'btn-bet-chip--active' : ''}" onclick="setDefaultBet(5)">5</button>
        <button type="button" class="btn-bet-chip ${bet === 10 ? 'btn-bet-chip--active' : ''}" onclick="setDefaultBet(10)">10</button>
        <button type="button" class="btn-bet-chip ${bet === 20 ? 'btn-bet-chip--active' : ''}" onclick="setDefaultBet(20)">20</button>
      </div>
      <input type="number" id="input-round-default-bet" class="bet-input" value="${bet}" min="0" onchange="setDefaultBet(Number(this.value))">
    </div>
  `;
}

function setDefaultBet(newBet) {
  const val = Math.max(0, parseInt(newBet, 10) || 0);
  appState.newGame.defaultBet = val;
  renderNewGameStep2Bet();
  renderNewGameStep5Preview();
}

function renderNewGameStep3Opponents() {
  const container = document.getElementById('step-opponents-list');
  if (!container) return;

  if (!appState.newGame.leaderId) {
    container.innerHTML = `
      <div style="font-size: 0.85rem; color: var(--text-muted); padding: 12px 0; text-align: center;">
        👆 Vui lòng chọn <b>Người Cầm Đầu (A)</b> ở Bước 1 trước.
      </div>
    `;
    return;
  }

  const activeOpponents = (appState.players || []).filter(
    (p) => p.active !== false && p.playerId !== appState.newGame.leaderId
  );

  if (activeOpponents.length === 0) {
    container.innerHTML = `
      <div style="font-size: 0.85rem; color: var(--text-muted); padding: 12px 0;">
        Cần ít nhất 2 người chơi trong phiên.
      </div>
    `;
    return;
  }

  let html = '';
  activeOpponents.forEach((p) => {
    const currentResult = appState.newGame.results[p.playerId] || 'DRAW';
    const hasCustomBet = appState.newGame.customBets[p.playerId] !== undefined;
    const effectiveBet = hasCustomBet ? appState.newGame.customBets[p.playerId] : appState.newGame.defaultBet;

    let delta = 0;
    if (currentResult === 'WIN') delta = effectiveBet;
    else if (currentResult === 'LOSE') delta = -effectiveBet;

    let deltaClass = 'score-neutral';
    let deltaPrefix = '';
    if (delta > 0) {
      deltaClass = 'score-win';
      deltaPrefix = '+';
    } else if (delta < 0) {
      deltaClass = 'score-lose';
    }

    html += `
      <div class="opponent-row">
        <div class="opponent-row__name-col">
          <div class="opponent-row__name">${escapeHtml(p.name)}</div>
          <div class="opponent-row__bet-label" onclick="promptCustomBet('${p.playerId}', '${escapeHtml(p.name)}')">
            Cược: <b>${effectiveBet}</b> ${hasCustomBet ? '<span style="color: var(--color-primary); font-size: 0.7rem;">(Riêng)</span>' : ''} ✏️
          </div>
        </div>

        <div class="opponent-row__action-col">
          <div class="btn-result-group" role="group" aria-label="Kết quả đối đầu của ${escapeHtml(p.name)}">
            <button type="button" class="btn-result btn-result--win ${currentResult === 'WIN' ? 'btn-result--active' : ''}" 
                    aria-label="Thắng (+${effectiveBet})" onclick="setOpponentResult('${p.playerId}', 'WIN')">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
              <span>+ Thắng</span>
            </button>
            <button type="button" class="btn-result btn-result--draw ${currentResult === 'DRAW' ? 'btn-result--active' : ''}" 
                    aria-label="Hòa (0)" onclick="setOpponentResult('${p.playerId}', 'DRAW')">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="8" y1="12" x2="16" y2="12"></line></svg>
              <span>0 Hòa</span>
            </button>
            <button type="button" class="btn-result btn-result--lose ${currentResult === 'LOSE' ? 'btn-result--active' : ''}" 
                    aria-label="Thua (-${effectiveBet})" onclick="setOpponentResult('${p.playerId}', 'LOSE')">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
              <span>- Thua</span>
            </button>
          </div>
          <div class="opponent-row__delta ${deltaClass}">
            ${deltaPrefix}${delta}
          </div>
        </div>
      </div>
    `;
  });

  container.innerHTML = html;
}

function setOpponentResult(playerId, result) {
  appState.newGame.results[playerId] = result;
  renderNewGameStep3Opponents();
  renderNewGameStep5Preview();
}

function promptCustomBet(playerId, playerName) {
  const current = appState.newGame.customBets[playerId] !== undefined
    ? appState.newGame.customBets[playerId]
    : appState.newGame.defaultBet;

  const valStr = prompt(`Nhập mức cược riêng cho '${playerName}' (Để trống để dùng mặc định ${appState.newGame.defaultBet}):`, current);
  if (valStr === null) return;

  const clean = valStr.trim();
  if (clean === '') {
    delete appState.newGame.customBets[playerId];
  } else {
    const num = parseInt(clean, 10);
    if (!isNaN(num) && num >= 0) {
      appState.newGame.customBets[playerId] = num;
    } else {
      showToast('Mức cược phải là số nguyên không âm.', 'warning');
    }
  }

  renderNewGameStep3Opponents();
  renderNewGameStep5Preview();
}

function renderNewGameStep5Preview() {
  const container = document.getElementById('step-preview-container');
  if (!container) return;

  if (!appState.newGame.leaderId) {
    container.innerHTML = '';
    return;
  }

  const leader = (appState.players || []).find((p) => p.playerId === appState.newGame.leaderId);
  const leaderName = leader ? leader.name : 'Người cầm đầu';

  const activeOpponents = (appState.players || []).filter(
    (p) => p.active !== false && p.playerId !== appState.newGame.leaderId
  );

  let sumOpponentsDelta = 0;
  let totalTrans = 0;

  activeOpponents.forEach((opp) => {
    const res = appState.newGame.results[opp.playerId] || 'DRAW';
    const effectiveBet = appState.newGame.customBets[opp.playerId] !== undefined
      ? appState.newGame.customBets[opp.playerId]
      : appState.newGame.defaultBet;

    let delta = 0;
    if (res === 'WIN') delta = effectiveBet;
    else if (res === 'LOSE') delta = -effectiveBet;

    sumOpponentsDelta += delta;
    totalTrans += Math.abs(delta);
  });

  const leaderDelta = sumOpponentsDelta === 0 ? 0 : -sumOpponentsDelta;

  let leaderDeltaClass = 'score-neutral';
  let leaderPrefix = '';
  if (leaderDelta > 0) {
    leaderDeltaClass = 'score-win';
    leaderPrefix = '+';
  } else if (leaderDelta < 0) {
    leaderDeltaClass = 'score-lose';
  }

  container.innerHTML = `
    <div class="card" style="background-color: var(--bg-subtle); border-left: 4px solid var(--color-primary);">
      <div style="font-weight: 700; font-size: 0.95rem; margin-bottom: 6px;">5. Điểm Dự Kiến Ván Này</div>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
        <span style="font-size: 0.9rem;">Điểm ${escapeHtml(leaderName)} (A):</span>
        <span class="${leaderDeltaClass}" style="font-size: 1.1rem; font-weight: 800;">${leaderPrefix}${leaderDelta}</span>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--text-muted);">
        <span>Tổng giao dịch ván:</span>
        <span><b>${totalTrans}</b> điểm</span>
      </div>
    </div>
  `;
}

/**
 * Submits new game with STALE_DATA check and idempotency (Task 5.1 & 5.3)
 */
async function submitGame() {
  if (appState.isSubmitting) return;

  const leaderId = appState.newGame.leaderId;
  if (!leaderId) {
    showToast('Vui lòng chọn Người Cầm Đầu (A) ở Bước 1.', 'warning');
    return;
  }

  const activeOpponents = (appState.players || []).filter(
    (p) => p.active !== false && p.playerId !== leaderId
  );

  if (activeOpponents.length === 0) {
    showToast('Cần ít nhất 1 người đối đầu để chốt ván.', 'warning');
    return;
  }

  const opponentsPayload = activeOpponents.map((opp) => {
    const res = appState.newGame.results[opp.playerId] || 'DRAW';
    const bet = appState.newGame.customBets[opp.playerId] !== undefined
      ? appState.newGame.customBets[opp.playerId]
      : appState.newGame.defaultBet;

    return {
      playerId: opp.playerId,
      result: res,
      bet: bet
    };
  });

  const btnSubmit = document.getElementById('btn-submit-game');
  const originalBtnHtml = btnSubmit ? btnSubmit.innerHTML : '';

  try {
    appState.isSubmitting = true;
    if (btnSubmit) {
      btnSubmit.disabled = true;
      btnSubmit.innerHTML = `<span>⏳ Đang chốt ván...</span>`;
    }

    const payload = {
      leaderId: leaderId,
      defaultBet: appState.newGame.defaultBet,
      opponents: opponentsPayload,
      note: appState.newGame.note || '',
      expectedLatestGameNumber: appState.latestGameNumber,
      requestId: generateClientRequestId()
    };

    const res = await GasClient.call('saveGame', payload);

    if (res && res.game) {
      // Update scoreboard & latest game number
      if (res.scoreboard) appState.scoreboard = res.scoreboard;
      if (typeof res.latestGameNumber === 'number') appState.latestGameNumber = res.latestGameNumber;
      else if (res.game.gameNumber) appState.latestGameNumber = res.game.gameNumber;

      appState.lastSyncedAt = new Date();
      updateSyncTimeLabel();

      renderScoreboard();

      // Trigger Quick Undo Floating Banner
      triggerQuickUndoBanner(res.game.gameId, res.game.gameNumber);

      // Reset new game inputs
      appState.newGame.results = {};
      appState.newGame.customBets = {};
      appState.newGame.note = '';

      renderNewGameStep3Opponents();
      renderNewGameStep5Preview();

      showToast(`Đã chốt ván #${res.game.gameNumber} thành công!`, 'success');

      // Switch to Scoreboard
      navigateTo('scoreboard');
    }
  } catch (err) {
    console.error('[submitGame] Error:', err);

    if (err.code === 'STALE_DATA') {
      // Show Stale Data Modal Warning (Task 5.3)
      showStaleDataModal(err.message);
    } else {
      showToast(`Lỗi: ${err.message}`, 'danger');
    }
  } finally {
    appState.isSubmitting = false;
    if (btnSubmit) {
      btnSubmit.disabled = false;
      btnSubmit.innerHTML = originalBtnHtml;
    }
  }
}

function triggerQuickUndoBanner(gameId, gameNumber) {
  const banner = document.getElementById('quick-undo-banner');
  const textEl = document.getElementById('quick-undo-text');
  const countdownEl = document.getElementById('quick-undo-countdown');
  const progressEl = document.getElementById('quick-undo-progress');

  if (!banner) return;

  dismissQuickUndo();

  appState.quickUndo.active = true;
  appState.quickUndo.gameId = gameId;
  appState.quickUndo.gameNumber = gameNumber;
  appState.quickUndo.remainingSeconds = 8;

  if (textEl) textEl.textContent = `Đã chốt ván #${gameNumber}`;
  if (countdownEl) countdownEl.textContent = '8';
  if (progressEl) {
    progressEl.style.transition = 'none';
    progressEl.style.width = '100%';
    setTimeout(() => {
      progressEl.style.transition = 'width 8s linear';
      progressEl.style.width = '0%';
    }, 50);
  }

  banner.classList.add('quick-undo-banner--active');

  appState.quickUndo.intervalId = setInterval(() => {
    appState.quickUndo.remainingSeconds -= 1;
    if (countdownEl) countdownEl.textContent = Math.max(0, appState.quickUndo.remainingSeconds);
    if (appState.quickUndo.remainingSeconds <= 0) {
      dismissQuickUndo();
    }
  }, 1000);

  appState.quickUndo.timerId = setTimeout(() => {
    dismissQuickUndo();
  }, 8000);
}

function dismissQuickUndo() {
  if (appState.quickUndo.timerId) clearTimeout(appState.quickUndo.timerId);
  if (appState.quickUndo.intervalId) clearInterval(appState.quickUndo.intervalId);

  appState.quickUndo.active = false;
  appState.quickUndo.timerId = null;
  appState.quickUndo.intervalId = null;

  const banner = document.getElementById('quick-undo-banner');
  if (banner) banner.classList.remove('quick-undo-banner--active');
}

async function triggerQuickUndo() {
  const gameId = appState.quickUndo.gameId;
  const gameNumber = appState.quickUndo.gameNumber;
  if (!gameId) return;

  dismissQuickUndo();

  try {
    showToast(`Đang hoàn tác ván #${gameNumber}...`, 'info');
    const res = await GasClient.call('undoGame', gameId);

    if (res && res.scoreboard) {
      appState.scoreboard = res.scoreboard;
      renderScoreboard();
    }

    if (appState.currentView === 'history') {
      loadHistory(false);
    }

    showToast(`Đã hoàn tác ván #${gameNumber} thành công.`, 'success');
  } catch (err) {
    console.error('[triggerQuickUndo] Error:', err);
    showToast(`Lỗi hoàn tác: ${err.message}`, 'danger');
  }
}

    `;

function renderHistoryList(items) {
  const container = document.getElementById('history-container');
  if (!container) return;

  if (!items || items.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">📜</div>
        <div class="empty-state__title">Không Có Ván Đấu Nào</div>
        <div class="empty-state__description">Không tìm thấy ván đấu nào khớp với điều kiện lọc hiện tại.</div>
      </div>
    `;
    return;
  }

  let html = '<div class="history-list">';
  items.forEach((g) => {
    let statusBadge = '<span class="badge-status badge-status--active">Hợp lệ</span>';
    if (g.status === 'DA_CHINH_SUA') {
      statusBadge = '<span class="badge-status badge-status--edited">Đã sửa</span>';
    } else if (g.status === 'DA_HUY') {
      statusBadge = '<span class="badge-status badge-status--cancelled">Đã hủy</span>';
    }

    let leaderPrefix = '';
    let leaderClass = 'score-neutral';
    if (g.leaderDelta > 0) {
      leaderPrefix = '+';
      leaderClass = 'score-win';
    } else if (g.leaderDelta < 0) {
      leaderClass = 'score-lose';
    }

    const timeStr = formatGameTime(g.playedAt);

    let oppTags = '';
    (g.details || []).forEach((opp) => {
      let tagClass = 'tag-draw';
      let tagPrefix = '';
      if (opp.delta > 0) {
        tagClass = 'tag-win';
        tagPrefix = '+';
      } else if (opp.delta < 0) {
        tagClass = 'tag-lose';
      }
      oppTags += `<span class="history-opp-tag ${tagClass}">${escapeHtml(opp.name)}: ${tagPrefix}${opp.delta}</span>`;
    });

    html += `
      <div class="history-card card ${g.isCancelled ? 'history-card--cancelled' : ''}" onclick="openGameDetailModal('${g.gameId}')">
        <div class="history-card__header">
          <div style="display: flex; align-items: center; gap: 8px;">
            <span class="history-card__num">#${g.gameNumber}</span>
            <span class="history-card__time">${timeStr}</span>
          </div>
          <div>${statusBadge}</div>
        </div>
        <div class="history-card__body">
          <div class="history-card__leader">
            <span>👑 A: <b>${escapeHtml(g.leaderName)}</b></span>
            <span class="${leaderClass}" style="font-weight: 800;">${leaderPrefix}${g.leaderDelta}</span>
          </div>
          <div class="history-card__opponents">
            ${oppTags}
          </div>
        </div>
        <div class="history-card__footer">
          <span>Giao dịch: <b>${g.transactionTotal}</b> điểm</span>
          <span style="color: var(--color-primary); font-size: 0.78rem;">Chi tiết ❯</span>
        </div>
      </div>
    `;
  });
  html += '</div>';

  container.innerHTML = html;
}

  if (appState.historyFilters.playerId) activeCount++;
  if (appState.historyFilters.leaderId) activeCount++;
  if (appState.historyFilters.result !== 'ALL') activeCount++;
  if (appState.historyFilters.status !== 'HOP_LE') activeCount++;
  if (appState.historyFilters.fromGameNumber || appState.historyFilters.toGameNumber) activeCount++;

  if (activeCount > 0) {
    badge.textContent = activeCount;
    badge.style.display = 'inline-flex';

function renderEditGameForm() {
  const body = document.getElementById('modal-edit-body');
  if (!body) return;

  const eg = appState.editingGame;
  const activePlayers = (appState.players || []).filter((p) => p.active !== false);

  let leaderOptions = '';
  activePlayers.forEach((p) => {
    leaderOptions += `<option value="${p.playerId}" ${p.playerId === eg.leaderId ? 'selected' : ''}>${escapeHtml(p.name)}</option>`;
  });

  const opponents = activePlayers.filter((p) => p.playerId !== eg.leaderId);

  let oppRows = '';
  opponents.forEach((opp) => {
    const currentRes = eg.results[opp.playerId] || 'DRAW';
    const effectiveBet = eg.customBets[opp.playerId] !== undefined ? eg.customBets[opp.playerId] : eg.defaultBet;

    oppRows += `
      <div class="opponent-row" style="padding: 8px 0; border-bottom: 1px solid var(--border-light);">
        <div class="opponent-row__name-col">
          <div class="opponent-row__name">${escapeHtml(opp.name)}</div>
          <div style="font-size: 0.75rem; color: var(--text-muted);">Cược: ${effectiveBet}</div>
        </div>
        <div class="opponent-row__action-col">
          <div class="btn-result-group">
            <button type="button" class="btn-result btn-result--win ${currentRes === 'WIN' ? 'btn-result--active' : ''}" onclick="setEditOpponentResult('${opp.playerId}', 'WIN')">+ Thắng</button>
            <button type="button" class="btn-result btn-result--draw ${currentRes === 'DRAW' ? 'btn-result--active' : ''}" onclick="setEditOpponentResult('${opp.playerId}', 'DRAW')">0 Hòa</button>
            <button type="button" class="btn-result btn-result--lose ${currentRes === 'LOSE' ? 'btn-result--active' : ''}" onclick="setEditOpponentResult('${opp.playerId}', 'LOSE')">- Thua</button>
          </div>
        </div>
      </div>
    `;
  });

  body.innerHTML = `
    <div style="margin-bottom: 14px;">
      <label class="filter-label">Người Cầm Đầu (A):</label>
      <select class="filter-select" onchange="changeEditLeader(this.value)">
        ${leaderOptions}
      </select>
    </div>
    <div style="margin-bottom: 14px;">
      <label class="filter-label">Mức Cược Mặc Định:</label>
      <input type="number" class="filter-input" value="${eg.defaultBet}" min="0" onchange="changeEditDefaultBet(Number(this.value))">
    </div>
    <div style="margin-bottom: 14px;">
      <label class="filter-label">Kết Quả Người Đối Đầu:</label>
      <div style="display: flex; flex-direction: column; gap: 4px;">
        ${oppRows}
      </div>
    </div>
    <div>
      <label class="filter-label">Ghi Chú:</label>
      <input type="text" class="filter-input" value="${escapeHtml(eg.note)}" placeholder="Lý do sửa..." onchange="appState.editingGame.note = this.value">
    </div>
  `;
}

function setEditOpponentResult(playerId, result) {
  appState.editingGame.results[playerId] = result;
  renderEditGameForm();
}

function changeEditLeader(newLeaderId) {
  appState.editingGame.leaderId = newLeaderId;
  delete appState.editingGame.results[newLeaderId];
  delete appState.editingGame.customBets[newLeaderId];
  renderEditGameForm();
}

function changeEditDefaultBet(newBet) {
  appState.editingGame.defaultBet = Math.max(0, parseInt(newBet, 10) || 0);
  renderEditGameForm();
}

function closeEditGameModal() {
  const modal = document.getElementById('modal-edit-game');
  if (modal) modal.classList.remove('modal-backdrop--open');
}

async function submitUpdateGame() {
  const eg = appState.editingGame;
  if (!eg.gameId || !eg.leaderId) return;

  const activeOpponents = (appState.players || []).filter(
    (p) => p.active !== false && p.playerId !== eg.leaderId
  );

  const opponentsPayload = activeOpponents.map((opp) => {
    const res = eg.results[opp.playerId] || 'DRAW';
    const bet = eg.customBets[opp.playerId] !== undefined ? eg.customBets[opp.playerId] : eg.defaultBet;
    return {
      playerId: opp.playerId,
      result: res,
      bet: bet
    };
  });

  const btnSave = document.getElementById('btn-save-edit-game');
  try {
    if (btnSave) btnSave.disabled = true;
    showToast(`Đang cập nhật ván #${eg.gameNumber}...`, 'info');

    const payload = {
      leaderId: eg.leaderId,
      defaultBet: eg.defaultBet,
      opponents: opponentsPayload,
      note: eg.note || ''
    };

    const res = await GasClient.call('updateGame', eg.gameId, payload);

    if (res && res.scoreboard) {
      appState.scoreboard = res.scoreboard;
      renderScoreboard();
    }

    closeEditGameModal();
    if (appState.currentView === 'history') {
      loadHistory(false);
    }

    showToast(`Đã cập nhật ván #${eg.gameNumber} thành công!`, 'success');
  } catch (err) {
    console.error('[submitUpdateGame] Error:', err);
    showToast(`Lỗi cập nhật: ${err.message}`, 'danger');
  } finally {
    if (btnSave) btnSave.disabled = false;
  }
}

function renderPlayersList() {
  const container = document.getElementById('players-list-container');
  if (!container) return;

  const list = appState.players || [];
  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">👥</div>
        <div class="empty-state__title">Chưa Có Người Chơi</div>
        <div class="empty-state__description">Hãy nhập tên và bấm 'Thêm' ở trên để bắt đầu thêm người chơi.</div>
      </div>
    `;
    return;
  }

  let html = '<div class="players-list" style="display: flex; flex-direction: column; gap: 8px;">';
  list.forEach((p) => {
    const isActive = p.active !== false;
    html += `
      <div class="card" style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px;">
        <div style="display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 1.1rem;">👤</span>
          <div>
            <div style="font-weight: 700; font-size: 0.95rem; color: var(--text-main);">${escapeHtml(p.name)}</div>
            <div style="font-size: 0.75rem; color: var(--text-muted);">Mã: ${p.playerId}</div>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 8px;">
          ${isActive 
            ? `<button type="button" class="btn-bet-chip" style="font-size: 0.75rem; padding: 4px 8px; color: var(--color-danger);" onclick="handleDeactivatePlayer('${p.playerId}', '${escapeHtml(p.name)}')">Nghỉ chơi</button>` 
            : `<span class="badge-status badge-status--cancelled">Đã nghỉ</span>`}
          <button type="button" class="icon-button" style="width: 32px; height: 32px;" onclick="promptRenamePlayer('${p.playerId}', '${escapeHtml(p.name)}')">✏️</button>
        </div>
      </div>
    `;
  });
  html += '</div>';

  container.innerHTML = html;
}

async function handleAddPlayer(e) {
  if (e) e.preventDefault();
  const input = document.getElementById('input-new-player-name');
  if (!input) return;

  const name = input.value.trim();
  if (!name) return;

  try {
    showToast(`Đang thêm '${name}'...`, 'info');
    const created = await GasClient.call('addPlayer', name);
    input.value = '';

    await refreshAppData(false);
    showToast(`Đã thêm người chơi '${name}' thành công!`, 'success');
  } catch (err) {
    console.error('[handleAddPlayer] Error:', err);
    showToast(`Lỗi thêm người chơi: ${err.message}`, 'danger');
  }
}

async function promptRenamePlayer(playerId, currentName) {
  const newName = prompt(`Đổi tên cho người chơi '${currentName}':`, currentName);
  if (!newName || newName.trim() === '' || newName.trim() === currentName) return;

  try {
    showToast(`Đang cập nhật...`, 'info');
    await GasClient.call('updatePlayer', playerId, { name: newName.trim() });
    await refreshAppData(false);
    showToast(`Đã đổi tên thành '${newName.trim()}'.`, 'success');
  } catch (err) {
    console.error('[promptRenamePlayer] Error:', err);
    showToast(`Lỗi đổi tên: ${err.message}`, 'danger');
  }
}

function handleDeactivatePlayer(playerId, name) {
  showConfirmDialog(
    'Xác nhận cho nghỉ chơi',
    `Người chơi <b>${escapeHtml(name)}</b> sẽ không xuất hiện trong danh sách tạo ván mới.<br><span style="font-size: 0.85rem; color: var(--text-muted);">Dữ liệu điểm cũ vẫn được giữ nguyên.</span>`,
    async () => {
      try {
        showToast(`Đang cập nhật trạng thái...`, 'info');
        await GasClient.call('deactivatePlayer', playerId);
        await refreshAppData(false);
        showToast(`Người chơi '${name}' đã chuyển sang trạng thái nghỉ chơi.`, 'success');
      } catch (err) {
        console.error('[handleDeactivatePlayer] Error:', err);
        showToast(`Lỗi: ${err.message}`, 'danger');
      }
    }
  );
}

function showToast(message, type = 'info') {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast toast--${type}`;

  let icon = 'ℹ️';
  if (type === 'success') icon = '✅';
  else if (type === 'danger') icon = '⚠️';
  else if (type === 'warning') icon = '⚠️';

  toast.innerHTML = `
    <span>${icon}</span>
    <span style="flex: 1;">${escapeHtml(message)}</span>
  `;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 300);
  }, 3500);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function formatGameTime(isoString) {
  if (!isoString) return '';
  try {
    const d = new Date(isoString);
    if (isNaN(d.getTime())) return String(isoString);
    const hh = String(d.getHours()).padStart(2, '0');
    const mm = String(d.getMinutes()).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const MM = String(d.getMonth() + 1).padStart(2, '0');
    return `${hh}:${mm} ${dd}/${MM}`;
  } catch (e) {
    return String(isoString);
  }
}

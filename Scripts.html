<script>
/**
 * ==========================================================================
 * Scripts.html - Frontend Application Logic, State Management & API Adapter
 * Google Apps Script Web App (Mobile First) - Phase 4 Comprehensive
 * ==========================================================================
 */

// Central Application Reactive State
const appState = {
  currentView: 'scoreboard',
  session: {
    appName: 'Chốt Điểm',
    sessionId: '',
    sessionName: 'Phiên chơi',
    defaultBet: 5,
    timezone: 'Asia/Ho_Chi_Minh',
    schemaVersion: '1.0.0'
  },
  players: [],
  scoreboard: [],
  history: [],
  historyFilters: {
    playerId: '',
    leaderId: '',
    result: 'ALL',
    status: 'HOP_LE',
    fromGameNumber: '',
    toGameNumber: '',
    isPanelOpen: false
  },
  newGame: {
    leaderId: null,
    defaultBet: 5,
    customBets: {}, // { [playerId]: number }
    results: {},    // { [playerId]: 'WIN' | 'DRAW' | 'LOSE' }
    note: '',
    editingBet: false,
    editingCustomBetId: null
  },
  editingGame: {
    gameId: null,
    gameNumber: null,
    leaderId: null,
    defaultBet: 5,
    customBets: {},
    results: {},
    note: ''
  },
  quickUndo: {
    active: false,
    gameId: null,
    gameNumber: null,
    timerId: null,
    intervalId: null,
    remainingSeconds: 8
  },
  loading: {
    app: true,
    scoreboard: false,
    newGame: false,
    history: false,
    players: false,
    settings: false,
    detailModal: false
  },
  isSubmitting: false,
  errors: {}
};

// ==========================================================================
// 1. API Client Adapter (Promise wrapper for google.script.run with Fallback)
// ==========================================================================
const apiClient = {
  call(functionName, ...args) {
    return new Promise((resolve, reject) => {
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((response) => {
            if (response && response.ok === false) {
              const err = new Error(response.error ? response.error.message : 'Đã xảy ra lỗi');
              err.code = response.error ? response.error.code : 'UNKNOWN_ERROR';
              err.details = response.error ? response.error.details : null;
              reject(err);
            } else {
              resolve(response ? response.data : null);
            }
          })
          .withFailureHandler((error) => {
            console.error(`[API Error] ${functionName}:`, error);
            const err = new Error(error.message || 'Lỗi kết nối máy chủ Google Apps Script');
            err.code = 'NETWORK_ERROR';
            reject(err);
          })[functionName](...args);
      } else {
        // Standalone/Local testing fallback mock
        console.warn(`[Mock API] google.script.run not available. Simulating: ${functionName}`);
        setTimeout(() => {
          resolve(mockApiResponse(functionName, args));
        }, 250);
      }
    });
  }
};

// Standalone Mock Fallback
function mockApiResponse(fn, args) {
  if (fn === 'getAppStatus') {
    return { appName: 'Chốt Điểm (Mock)', sessionId: 'CP-LOCAL', sessionName: 'Phiên Cục Bộ', defaultBet: 5 };
  }
  if (fn === 'getPlayers') {
    return [
      { playerId: 'P001', name: 'An Nguyễn', order: 1, active: true, status: 'DANG_CHOI' },
      { playerId: 'P002', name: 'Bình Trần', order: 2, active: true, status: 'DANG_CHOI' },
      { playerId: 'P003', name: 'Cường Lê', order: 3, active: true, status: 'DANG_CHOI' },
      { playerId: 'P004', name: 'Dũng Phạm', order: 4, active: true, status: 'DANG_CHOI' }
    ];
  }
  if (fn === 'getScoreboard') {
    return [
      { rank: 1, playerId: 'P001', name: 'An Nguyễn', active: true, totalScore: 15, wins: 3, draws: 1, losses: 1, leaderCount: 2, gamesPlayed: 5 },
      { rank: 2, playerId: 'P002', name: 'Bình Trần', active: true, totalScore: 5, wins: 2, draws: 2, losses: 1, leaderCount: 1, gamesPlayed: 5 },
      { rank: 3, playerId: 'P003', name: 'Cường Lê', active: true, totalScore: -5, wins: 1, draws: 1, losses: 3, leaderCount: 1, gamesPlayed: 5 },
      { rank: 4, playerId: 'P004', name: 'Dũng Phạm', active: true, totalScore: -15, wins: 0, draws: 2, losses: 3, leaderCount: 1, gamesPlayed: 5 }
    ];
  }
  if (fn === 'getGameHistory') {
    return {
      items: [
        {
          gameId: 'V000001', gameNumber: 1, playedAt: new Date().toISOString(),
          leaderId: 'P001', leaderName: 'An Nguyễn', defaultBet: 5, leaderDelta: 15, transactionTotal: 15,
          details: [
            { playerId: 'P002', name: 'Bình Trần', result: 'LOSE', bet: 5, delta: -5 },
            { playerId: 'P003', name: 'Cường Lê', result: 'LOSE', bet: 5, delta: -5 },
            { playerId: 'P004', name: 'Dũng Phạm', result: 'LOSE', bet: 5, delta: -5 }
          ],
          status: 'HOP_LE', canEdit: true, canCancel: true, canRestore: false, isEdited: false, isCancelled: false
        }
      ],
      total: 1
    };
  }
  if (fn === 'getGameDetail') {
    return {
      gameId: args[0], gameNumber: 1, playedAt: new Date().toISOString(),
      leaderId: 'P001', leaderName: 'An Nguyễn', defaultBet: 5, leaderDelta: 15, transactionTotal: 15,
      details: [
        { playerId: 'P002', name: 'Bình Trần', result: 'LOSE', bet: 5, delta: -5 },
        { playerId: 'P003', name: 'Cường Lê', result: 'LOSE', bet: 5, delta: -5 },
        { playerId: 'P004', name: 'Dũng Phạm', result: 'LOSE', bet: 5, delta: -5 }
      ],
      participants: [
        { playerId: 'P001', name: 'An Nguyễn', role: 'LEADER', roleLabel: 'Người cầm đầu (A)', result: 'WIN', bet: 5, delta: 15 },
        { playerId: 'P002', name: 'Bình Trần', role: 'OPPONENT', roleLabel: 'Người đối đầu', result: 'LOSE', bet: 5, delta: -5 },
        { playerId: 'P003', name: 'Cường Lê', role: 'OPPONENT', roleLabel: 'Người đối đầu', result: 'LOSE', bet: 5, delta: -5 },
        { playerId: 'P004', name: 'Dũng Phạm', role: 'OPPONENT', roleLabel: 'Người đối đầu', result: 'LOSE', bet: 5, delta: -5 }
      ],
      status: 'HOP_LE', canEdit: true, canCancel: true, canRestore: false
    };
  }
  if (fn === 'saveGame') {
    return {
      game: { gameId: 'V000002', gameNumber: 2, playedAt: new Date().toISOString(), leaderDelta: 0, status: 'HOP_LE' },
      scoreboard: [],
      undoExpiresAt: new Date(Date.now() + 8000).toISOString()
    };
  }
  if (fn === 'updateGame' || fn === 'cancelGame' || fn === 'restoreGame' || fn === 'undoGame') {
    return {
      game: { gameId: args[0], status: fn === 'cancelGame' || fn === 'undoGame' ? 'DA_HUY' : 'HOP_LE' },
      scoreboard: []
    };
  }
  return {};
}

// ==========================================================================
// 2. Navigation & View Routing
// ==========================================================================
function navigateTo(viewName) {
  if (!['scoreboard', 'new-game', 'history', 'players', 'settings'].includes(viewName)) {
    viewName = 'scoreboard';
  }

  appState.currentView = viewName;

  document.querySelectorAll('.view').forEach((el) => {
    el.classList.remove('view--active');
  });
  const targetView = document.getElementById(`view-${viewName}`);
  if (targetView) {
    targetView.classList.add('view--active');
  }

  document.querySelectorAll('.nav-item').forEach((el) => {
    el.classList.remove('nav-item--active');
    if (el.dataset.view === viewName) {
      el.classList.add('nav-item--active');
    }
  });

  if (viewName === 'scoreboard') {
    renderScoreboardView();
  } else if (viewName === 'new-game') {
    renderNewGameView();
  } else if (viewName === 'history') {
    populateFilterSelects();
    loadHistory();
  } else if (viewName === 'players') {
    renderPlayersView();
  } else if (viewName === 'settings') {
    renderSettingsView();
  }

  const mainEl = document.querySelector('.app-main');
  if (mainEl) mainEl.scrollTop = 0;
}

// ==========================================================================
// 3. Scoreboard Screen (Screen 1)
// ==========================================================================
function loadScoreboard() {
  appState.loading.scoreboard = true;
  renderScoreboardView();

  apiClient.call('getScoreboard')
    .then((data) => {
      appState.scoreboard = Array.isArray(data) ? data : [];
      appState.errors.scoreboard = null;
    })
    .catch((err) => {
      console.error('Error loading scoreboard:', err);
      appState.errors.scoreboard = err.message;
    })
    .finally(() => {
      appState.loading.scoreboard = false;
      renderScoreboardView();
    });
}

function renderScoreboardView() {
  const container = document.getElementById('scoreboard-container');
  if (!container) return;
  container.innerHTML = '';

  if (appState.loading.scoreboard) {
    container.innerHTML = `
      <div class="loading-container">
        <div class="spinner"></div>
        <p>Đang tải bảng điểm...</p>
      </div>
    `;
    return;
  }

  if (appState.errors.scoreboard) {
    container.innerHTML = `
      <div class="error-state">
        <p style="font-weight: 700; margin-bottom: 8px;">Không thể tải bảng điểm</p>
        <p style="font-size: 0.9rem; margin-bottom: 12px;">${escapeHtml(appState.errors.scoreboard)}</p>
        <button class="btn-secondary" onclick="loadScoreboard()">Thử lại</button>
      </div>
    `;
    return;
  }

  if (!appState.scoreboard || appState.scoreboard.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">🏆</div>
        <h3 class="empty-state__title">Chưa có dữ liệu bảng điểm</h3>
        <p style="font-size: 0.9rem; margin-bottom: 16px;">Hãy thêm người chơi và bắt đầu ván đấu đầu tiên.</p>
        <button class="btn-secondary" onclick="navigateTo('players')">+ Thêm người chơi</button>
      </div>
    `;
    return;
  }

  const listEl = document.createElement('div');
  listEl.className = 'scoreboard-list';

  appState.scoreboard.forEach((item) => {
    const card = document.createElement('div');
    card.className = `score-card ${item.rank === 1 ? 'score-card--rank-1' : item.rank === 2 ? 'score-card--rank-2' : item.rank === 3 ? 'score-card--rank-3' : ''}`;

    const rankEl = document.createElement('div');
    rankEl.className = 'score-card__rank';
    rankEl.textContent = String(item.rank);

    const infoEl = document.createElement('div');
    infoEl.className = 'score-card__info';

    const nameEl = document.createElement('div');
    nameEl.className = 'score-card__name';
    nameEl.textContent = item.name;

    if (!item.active) {
      const inactiveBadge = document.createElement('span');
      inactiveBadge.className = 'badge badge--inactive';
      inactiveBadge.textContent = 'Nghỉ';
      nameEl.appendChild(inactiveBadge);
    }

    if (item.playerId === appState.newGame.leaderId) {
      const leaderBadge = document.createElement('span');
      leaderBadge.className = 'badge badge--leader';
      leaderBadge.textContent = 'A Cầm đầu';
      nameEl.appendChild(leaderBadge);
    }

    const metaEl = document.createElement('div');
    metaEl.className = 'score-card__meta';
    metaEl.textContent = `${item.gamesPlayed || 0} ván (${item.wins || 0}T - ${item.draws || 0}H - ${item.losses || 0}B | ${item.leaderCount || 0}A)`;

    infoEl.appendChild(nameEl);
    infoEl.appendChild(metaEl);

    const scoreGroup = document.createElement('div');
    scoreGroup.className = 'score-card__score-group';

    const totalEl = document.createElement('div');
    const score = Number(item.totalScore) || 0;
    totalEl.className = `score-card__total ${score > 0 ? 'score-card__total--positive' : score < 0 ? 'score-card__total--negative' : 'score-card__total--zero'}`;
    totalEl.textContent = score > 0 ? `+${score}` : `${score}`;

    scoreGroup.appendChild(totalEl);

    card.appendChild(rankEl);
    card.appendChild(infoEl);
    card.appendChild(scoreGroup);

    listEl.appendChild(card);
  });

  container.appendChild(listEl);
}

// ==========================================================================
// 4. New Game Screen (Screen 2) - 6 Steps Workflow
// ==========================================================================
function renderNewGameView() {
  const activePlayers = (appState.players || []).filter((p) => p.active);

  if (!appState.newGame.leaderId && activePlayers.length > 0) {
    appState.newGame.leaderId = activePlayers[0].playerId;
  }

  renderStep1Leader(activePlayers);
  renderStep2DefaultBet();
  renderStep3Opponents(activePlayers);
  renderStep5Preview(activePlayers);
  renderStep6SubmitButton();
}

function renderStep1Leader(activePlayers) {
  const container = document.getElementById('step-leader-list');
  if (!container) return;
  container.innerHTML = '';

  if (activePlayers.length < 2) {
    container.innerHTML = `
      <p style="font-size: 0.9rem; color: var(--color-danger); padding: 8px 0;">
        Cần tối thiểu 2 người chơi để tạo ván đấu. Vui lòng thêm người chơi trước.
      </p>
    `;
    return;
  }

  activePlayers.forEach((player) => {
    const chip = document.createElement('button');
    chip.type = 'button';
    chip.className = `leader-chip ${player.playerId === appState.newGame.leaderId ? 'leader-chip--selected' : ''}`;
    chip.textContent = player.name;

    chip.addEventListener('click', () => {
      appState.newGame.leaderId = player.playerId;
      renderNewGameView();
    });

    container.appendChild(chip);
  });
}

function renderStep2DefaultBet() {
  const container = document.getElementById('step-default-bet-container');
  if (!container) return;
  container.innerHTML = '';

  const bar = document.createElement('div');
  bar.className = 'default-bet-bar';

  if (appState.newGame.editingBet) {
    bar.innerHTML = `
      <span style="font-weight: 600;">Sửa mức cược:</span>
      <div class="inline-input-group">
        <input type="number" id="input-default-bet" class="input-number" inputmode="numeric" min="0" value="${appState.newGame.defaultBet}">
        <button type="button" class="icon-button" style="color: var(--color-success);" onclick="saveDefaultBet()" title="Lưu">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </button>
        <button type="button" class="icon-button" style="color: var(--color-danger);" onclick="cancelEditDefaultBet()" title="Hủy">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>
    `;
  } else {
    bar.innerHTML = `
      <div class="bet-display">
        <span>Mức cược chung:</span>
        <span class="bet-amount">${appState.newGame.defaultBet}</span>
      </div>
      <button type="button" class="btn-secondary" style="min-height: 36px; padding: 0 12px; font-size: 0.85rem;" onclick="startEditDefaultBet()">Sửa cược</button>
    `;
  }

  container.appendChild(bar);
}

function startEditDefaultBet() {
  appState.newGame.editingBet = true;
  renderStep2DefaultBet();
  const input = document.getElementById('input-default-bet');
  if (input) { input.focus(); input.select(); }
}

function cancelEditDefaultBet() {
  appState.newGame.editingBet = false;
  renderStep2DefaultBet();
}

function saveDefaultBet() {
  const input = document.getElementById('input-default-bet');
  if (!input) return;
  const val = parseInt(input.value, 10);
  if (isNaN(val) || val < 0) {
    showToast('Mức cược phải là số nguyên >= 0', 'error');
    return;
  }
  appState.newGame.defaultBet = val;
  appState.newGame.editingBet = false;
  renderNewGameView();
}

function renderStep3Opponents(activePlayers) {
  const container = document.getElementById('step-opponents-list');
  if (!container) return;
  container.innerHTML = '';

  const opponents = activePlayers.filter((p) => p.playerId !== appState.newGame.leaderId);

  if (opponents.length === 0) {
    container.innerHTML = '<p class="empty-state">Chưa có người đối đầu.</p>';
    return;
  }

  opponents.forEach((opp) => {
    const card = document.createElement('div');
    const currentResult = appState.newGame.results[opp.playerId] || null;
    const effectiveBet = appState.newGame.customBets[opp.playerId] !== undefined
      ? appState.newGame.customBets[opp.playerId]
      : appState.newGame.defaultBet;

    let delta = 0;
    if (currentResult === 'WIN') delta = effectiveBet;
    else if (currentResult === 'LOSE') delta = -effectiveBet;

    card.className = `opp-card ${currentResult === 'WIN' ? 'opp-card--win' : currentResult === 'LOSE' ? 'opp-card--lose' : currentResult === 'DRAW' ? 'opp-card--draw' : ''}`;

    const headerEl = document.createElement('div');
    headerEl.className = 'opp-card__header';

    const nameEl = document.createElement('div');
    nameEl.className = 'opp-card__name';
    nameEl.textContent = opp.name;

    const deltaEl = document.createElement('div');
    deltaEl.className = `opp-card__delta ${delta > 0 ? 'opp-card__delta--pos' : delta < 0 ? 'opp-card__delta--neg' : 'opp-card__delta--zero'}`;
    deltaEl.textContent = delta > 0 ? `+${delta}` : `${delta}`;

    headerEl.appendChild(nameEl);
    headerEl.appendChild(deltaEl);

    const btnGroup = document.createElement('div');
    btnGroup.className = 'quick-buttons-group';

    const btnWin = document.createElement('button');
    btnWin.type = 'button';
    btnWin.className = 'btn-result btn-result--win';
    btnWin.setAttribute('aria-pressed', currentResult === 'WIN' ? 'true' : 'false');
    btnWin.innerHTML = `+ Thắng (${effectiveBet})`;
    btnWin.addEventListener('click', () => {
      appState.newGame.results[opp.playerId] = 'WIN';
      renderStep3Opponents(activePlayers);
      renderStep5Preview(activePlayers);
      renderStep6SubmitButton();
    });

    const btnDraw = document.createElement('button');
    btnDraw.type = 'button';
    btnDraw.className = 'btn-result btn-result--draw';
    btnDraw.setAttribute('aria-pressed', currentResult === 'DRAW' ? 'true' : 'false');
    btnDraw.innerHTML = '0 Hòa';
    btnDraw.addEventListener('click', () => {
      appState.newGame.results[opp.playerId] = 'DRAW';
      renderStep3Opponents(activePlayers);
      renderStep5Preview(activePlayers);
      renderStep6SubmitButton();
    });

    const btnLose = document.createElement('button');
    btnLose.type = 'button';
    btnLose.className = 'btn-result btn-result--lose';
    btnLose.setAttribute('aria-pressed', currentResult === 'LOSE' ? 'true' : 'false');
    btnLose.innerHTML = `- Thua (${effectiveBet})`;
    btnLose.addEventListener('click', () => {
      appState.newGame.results[opp.playerId] = 'LOSE';
      renderStep3Opponents(activePlayers);
      renderStep5Preview(activePlayers);
      renderStep6SubmitButton();
    });

    btnGroup.appendChild(btnWin);
    btnGroup.appendChild(btnDraw);
    btnGroup.appendChild(btnLose);

    const customBetEl = document.createElement('div');
    customBetEl.className = 'opp-card__custom-bet';

    const isEditingThisBet = appState.newGame.editingCustomBetId === opp.playerId;

    if (isEditingThisBet) {
      customBetEl.innerHTML = `
        <span style="font-weight: 600;">Cược riêng:</span>
        <div class="inline-input-group">
          <input type="number" id="input-custom-bet-${opp.playerId}" class="input-number" inputmode="numeric" min="0" value="${effectiveBet}">
          <button type="button" class="icon-button" style="color: var(--color-success);" onclick="saveCustomBet('${opp.playerId}')">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
          </button>
          <button type="button" class="icon-button" style="color: var(--color-danger);" onclick="cancelEditCustomBet()">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
      `;
    } else {
      const hasCustom = appState.newGame.customBets[opp.playerId] !== undefined;
      customBetEl.innerHTML = `
        <span>Cược: <strong>${effectiveBet}</strong> ${hasCustom ? '<em style="color: var(--color-primary);">(Riêng)</em>' : '(Chung)'}</span>
        <div>
          ${hasCustom ? `<button type="button" style="font-size: 0.75rem; color: var(--color-danger); margin-right: 8px;" onclick="resetCustomBet('${opp.playerId}')">Đặt lại cược chung</button>` : ''}
          <button type="button" style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600;" onclick="startEditCustomBet('${opp.playerId}')">Sửa cược</button>
        </div>
      `;
    }

    card.appendChild(headerEl);
    card.appendChild(btnGroup);
    card.appendChild(customBetEl);

    container.appendChild(card);
  });
}

function startEditCustomBet(playerId) {
  appState.newGame.editingCustomBetId = playerId;
  renderNewGameView();
  const input = document.getElementById(`input-custom-bet-${playerId}`);
  if (input) { input.focus(); input.select(); }
}

function cancelEditCustomBet() {
  appState.newGame.editingCustomBetId = null;
  renderNewGameView();
}

function saveCustomBet(playerId) {
  const input = document.getElementById(`input-custom-bet-${playerId}`);
  if (!input) return;
  const val = parseInt(input.value, 10);
  if (isNaN(val) || val < 0) {
    showToast('Mức cược phải là số nguyên >= 0', 'error');
    return;
  }
  appState.newGame.customBets[playerId] = val;
  appState.newGame.editingCustomBetId = null;
  renderNewGameView();
}

function resetCustomBet(playerId) {
  delete appState.newGame.customBets[playerId];
  renderNewGameView();
}

function renderStep5Preview(activePlayers) {
  const container = document.getElementById('step-preview-container');
  if (!container) return;

  const opponents = activePlayers.filter((p) => p.playerId !== appState.newGame.leaderId);
  const leader = activePlayers.find((p) => p.playerId === appState.newGame.leaderId);

  let opponentsSumDelta = 0;
  let chosenCount = 0;

  opponents.forEach((opp) => {
    const res = appState.newGame.results[opp.playerId];
    const bet = appState.newGame.customBets[opp.playerId] !== undefined
      ? appState.newGame.customBets[opp.playerId]
      : appState.newGame.defaultBet;

    if (res) {
      chosenCount++;
      if (res === 'WIN') opponentsSumDelta += bet;
      else if (res === 'LOSE') opponentsSumDelta -= bet;
    }
  });

  const leaderDelta = -opponentsSumDelta;
  const totalDelta = leaderDelta + opponentsSumDelta;
  const unchosenCount = opponents.length - chosenCount;

  container.innerHTML = `
    <div class="preview-card">
      <div class="preview-grid">
        <div class="preview-item">
          <div class="preview-label">Điểm của A (${escapeHtml(leader ? leader.name : 'Người cầm đầu')}):</div>
          <div class="preview-value" style="color: ${leaderDelta > 0 ? '#46e37b' : leaderDelta < 0 ? '#ff8080' : '#ffffff'};">
            ${leaderDelta > 0 ? `+${leaderDelta}` : `${leaderDelta}`}
          </div>
        </div>
        <div class="preview-item">
          <div class="preview-label">Tổng delta toàn ván:</div>
          <div class="preview-value" style="color: ${totalDelta === 0 ? '#ffffff' : '#ff8080'};">
            ${totalDelta}
          </div>
        </div>
      </div>
      ${unchosenCount > 0 ? `
        <div class="preview-warning">
          <span>⚠️ Có ${unchosenCount} người chưa chọn kết quả (sẽ tính là Hòa 0đ)</span>
        </div>
      ` : ''}
    </div>
  `;
}

function renderStep6SubmitButton() {
  const btn = document.getElementById('btn-submit-game');
  if (!btn) return;

  const activePlayers = (appState.players || []).filter((p) => p.active);
  const hasLeader = !!appState.newGame.leaderId;
  const hasOpponents = activePlayers.length >= 2;

  btn.disabled = appState.isSubmitting || !hasLeader || !hasOpponents;
  btn.innerHTML = appState.isSubmitting
    ? '<span class="spinner"></span> Đang chốt ván...'
    : '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg> Chốt Ván Đấu';
}

function submitGame() {
  if (appState.isSubmitting) return;

  const activePlayers = (appState.players || []).filter((p) => p.active);
  if (!appState.newGame.leaderId) {
    showToast('Vui lòng chọn người cầm đầu (A)', 'error');
    return;
  }

  const opponents = activePlayers.filter((p) => p.playerId !== appState.newGame.leaderId);
  if (opponents.length === 0) {
    showToast('Cần ít nhất 1 người đối đầu để tạo ván', 'error');
    return;
  }

  const opponentPayloads = opponents.map((opp) => {
    const res = appState.newGame.results[opp.playerId] || 'DRAW';
    const bet = appState.newGame.customBets[opp.playerId] !== undefined
      ? appState.newGame.customBets[opp.playerId]
      : appState.newGame.defaultBet;

    return {
      playerId: opp.playerId,
      result: res,
      bet: bet
    };
  });

  const payload = {
    leaderId: appState.newGame.leaderId,
    defaultBet: appState.newGame.defaultBet,
    opponents: opponentPayloads,
    note: appState.newGame.note || '',
    playedAt: new Date().toISOString()
  };

  appState.isSubmitting = true;
  renderStep6SubmitButton();

  apiClient.call('saveGame', payload)
    .then((result) => {
      showToast(`Đã chốt ván đấu #${result && result.game ? result.game.gameNumber : ''} thành công!`, 'success');

      // Reset newGame state
      appState.newGame.results = {};
      appState.newGame.customBets = {};
      appState.newGame.note = '';

      if (result && Array.isArray(result.scoreboard)) {
        appState.scoreboard = result.scoreboard;
      }

      // Task 4.5: Trigger Quick Undo Banner
      if (result && result.game) {
        showQuickUndo(result.game.gameId, result.game.gameNumber);
      }

      navigateTo('scoreboard');
    })
    .catch((err) => {
      console.error('Error saving game:', err);
      showToast(`Lỗi chốt ván: ${err.message}`, 'error');
    })
    .finally(() => {
      appState.isSubmitting = false;
      renderStep6SubmitButton();
    });
}

function populateFilterSelects() {

  selectLeader.innerHTML = '<option value="">-- Tất cả người cầm đầu --</option>';

  (appState.players || []).forEach((p) => {
    const optP = document.createElement('option');
    optP.value = p.playerId;
    optP.textContent = `${p.name} (${p.playerId})`;
    if (p.playerId === currentPVal) optP.selected = true;
    selectPlayer.appendChild(optP);

    const optL = document.createElement('option');

function toggleFilterPanel() {
  const body = document.getElementById('filter-body');
  const arrow = document.getElementById('filter-arrow-icon');
  if (!body) return;

  appState.historyFilters.isPanelOpen = !appState.historyFilters.isPanelOpen;

    if (arrow) arrow.textContent = '▲';
  } else {
    body.classList.remove('filter-body--open');

function applyHistoryFilters() {
  const pSelect = document.getElementById('filter-player');
  const lSelect = document.getElementById('filter-leader');
  const rSelect = document.getElementById('filter-result');
  const sSelect = document.getElementById('filter-status');
  const fromInput = document.getElementById('filter-from-game');
  const toInput = document.getElementById('filter-to-game');

  appState.historyFilters.playerId = pSelect ? pSelect.value : '';
  appState.historyFilters.leaderId = lSelect ? lSelect.value : '';
  appState.historyFilters.result = rSelect ? rSelect.value : 'ALL';
  appState.historyFilters.status = sSelect ? sSelect.value : 'HOP_LE';
  appState.historyFilters.fromGameNumber = fromInput ? fromInput.value : '';
  appState.historyFilters.toGameNumber = toInput ? toInput.value : '';

  // Update active count badge
  let activeCount = 0;
  if (appState.historyFilters.playerId) activeCount++;
  if (appState.historyFilters.leaderId) activeCount++;
  if (appState.historyFilters.result !== 'ALL') activeCount++;
  if (appState.historyFilters.status !== 'HOP_LE') activeCount++;
  if (appState.historyFilters.fromGameNumber) activeCount++;
  if (appState.historyFilters.toGameNumber) activeCount++;

  const countBadge = document.getElementById('filter-active-count');
  if (countBadge) {
    if (activeCount > 0) {
      countBadge.textContent = String(activeCount);
      countBadge.style.display = 'inline-flex';
    } else {
      countBadge.style.display = 'none';
    }
  }

  loadHistory();
}

function resetHistoryFilters() {
  const pSelect = document.getElementById('filter-player');
  const lSelect = document.getElementById('filter-leader');
  const rSelect = document.getElementById('filter-result');
  const sSelect = document.getElementById('filter-status');
  const fromInput = document.getElementById('filter-from-game');
  const toInput = document.getElementById('filter-to-game');

  if (pSelect) pSelect.value = '';
  if (lSelect) lSelect.value = '';
  if (rSelect) rSelect.value = 'ALL';
  if (sSelect) sSelect.value = 'HOP_LE';
  if (fromInput) fromInput.value = '';
  if (toInput) toInput.value = '';

  appState.historyFilters.playerId = '';
  appState.historyFilters.leaderId = '';
  appState.historyFilters.result = 'ALL';
  appState.historyFilters.status = 'HOP_LE';
  appState.historyFilters.fromGameNumber = '';
  appState.historyFilters.toGameNumber = '';

  const countBadge = document.getElementById('filter-active-count');
  if (countBadge) countBadge.style.display = 'none';

  loadHistory();

function loadHistory() {
  appState.loading.history = true;
  renderHistoryView();

  const filterParams = {
    playerId: appState.historyFilters.playerId || undefined,
    leaderId: appState.historyFilters.leaderId || undefined,
    result: appState.historyFilters.result || undefined,
    status: appState.historyFilters.status || undefined,
    fromGameNumber: appState.historyFilters.fromGameNumber ? parseInt(appState.historyFilters.fromGameNumber, 10) : undefined,
    toGameNumber: appState.historyFilters.toGameNumber ? parseInt(appState.historyFilters.toGameNumber, 10) : undefined,
    limit: 50
  };

  apiClient.call('getGameHistory', filterParams)
    .then((res) => {
      if (res && Array.isArray(res.items)) {
        appState.history = res.items;
      } else if (Array.isArray(res)) {
        appState.history = res;
      } else {
        appState.history = [];
      }
      appState.errors.history = null;
    })
    .catch((err) => {
      console.error('Error loading history:', err);
      appState.errors.history = err.message;
    })
    .finally(() => {
      appState.loading.history = false;
      renderHistoryView();
    });
}

function renderHistoryView() {
  const container = document.getElementById('history-container');
  if (!container) return;
  container.innerHTML = '';

  if (appState.loading.history) {
    container.innerHTML = `
      <div class="loading-container">
        <div class="spinner"></div>
        <p>Đang tải lịch sử ván đấu...</p>
      </div>
    `;
    return;
  }

  if (appState.errors.history) {
    container.innerHTML = `
      <div class="error-state">
        <p style="font-weight: 700; margin-bottom: 8px;">Không thể tải lịch sử</p>
        <p style="font-size: 0.9rem; margin-bottom: 12px;">${escapeHtml(appState.errors.history)}</p>
        <button class="btn-secondary" onclick="loadHistory()">Thử lại</button>
      </div>
    `;
    return;
  }

  if (!appState.history || appState.history.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state__icon">📜</div>
        <h3 class="empty-state__title">Không tìm thấy ván đấu phù hợp</h3>
        <p style="font-size: 0.9rem; margin-bottom: 16px;">Thử thay đổi bộ lọc hoặc tạo ván đấu mới.</p>
        <button class="btn-secondary" onclick="resetHistoryFilters()">Đặt lại bộ lọc</button>
      </div>
    `;
    return;
  }

  const listEl = document.createElement('div');
  listEl.className = 'history-list';

  appState.history.forEach((round) => {
    const card = document.createElement('div');
    const isCancelled = round.status === 'DA_HUY' || round.isCancelled;
    const isEdited = round.status === 'DA_CHINH_SUA' || round.isEdited;

    card.className = `history-card ${isCancelled ? 'history-card--cancelled' : ''} ${isEdited ? 'history-card--edited' : ''}`;
    card.style.cursor = 'pointer';

    const dateStr = round.playedAt ? new Date(round.playedAt).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) : '';

    let statusBadgeHtml = '';
    if (isCancelled) {
      statusBadgeHtml = '<span class="badge badge--cancelled">ĐÃ HỦY</span>';
    } else if (isEdited) {
      statusBadgeHtml = '<span class="badge badge--edited">ĐÃ SỬA</span>';
    } else {
      statusBadgeHtml = '<span class="badge badge--active">HỢP LỆ</span>';
    }

    card.innerHTML = `
      <div class="history-card__header">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span class="history-card__num">Ván #${round.gameNumber || round.SO_VAN || ''}</span>
          ${statusBadgeHtml}
        </div>
        <span class="history-card__time">${dateStr}</span>
      </div>
      <div class="history-card__leader">
        Cầm đầu: <strong>${escapeHtml(round.leaderName || round.TEN_NGUOI_CAM_DAU || round.leaderId)}</strong>
        <span style="color: ${round.leaderDelta > 0 ? 'var(--color-success)' : round.leaderDelta < 0 ? 'var(--color-danger)' : 'var(--text-muted)'}; font-weight: 800; margin-left: 6px;">
          (${round.leaderDelta > 0 ? `+${round.leaderDelta}` : `${round.leaderDelta}`})
        </span>
        <span style="font-size: 0.75rem; color: var(--text-muted); margin-left: 8px;">Tổng GD: ${round.transactionTotal || 0}đ</span>
      </div>
      <div class="history-card__details">
        ${Array.isArray(round.details) ? round.details.map((d) => `
          <span class="history-tag history-tag--${(d.result || '').toLowerCase()}">
            ${escapeHtml(d.name || d.playerId)}: ${d.result === 'WIN' ? '+'+d.delta : d.delta}
          </span>
        `).join('') : ''}
      </div>
    `;

    // Click card opens full Game Detail modal (Task 4.2)
    card.addEventListener('click', () => {
      openGameDetailModal(round.gameId);
    });

    listEl.appendChild(card);
  });

  container.appendChild(listEl);
}

  const title = document.getElementById('modal-edit-title');
  if (!modal || !body) return;

  if (title) title.textContent = `Chỉnh Sửa Ván #${game.gameNumber}`;

  // Populate appState.editingGame
  appState.editingGame.gameId = game.gameId;
  appState.editingGame.gameNumber = game.gameNumber;
  appState.editingGame.leaderId = game.leaderId;
  appState.editingGame.defaultBet = game.defaultBet || 5;
  appState.editingGame.note = game.note || '';

  appState.editingGame.leaderId = newLeaderId;

}

  const num = parseInt(val, 10);
  if (!isNaN(num) && num >= 0) {
    appState.editingGame.defaultBet = num;
    renderEditGameBody();
  }
}

function setEditOppResult(playerId, result) {
  appState.editingGame.results[playerId] = result;
  renderEditGameBody();
}

function closeEditGameModal() {

  if (modal) modal.classList.remove('modal-backdrop--open');
}

function submitUpdateGame() {
  const noteInput = document.getElementById('edit-note');
  const reason = noteInput ? noteInput.value.trim() : '';

  const activePlayers = (appState.players || []).filter((p) => p.active);
  const opponents = activePlayers.filter((p) => p.playerId !== appState.editingGame.leaderId);

  const opponentPayloads = opponents.map((opp) => ({
    playerId: opp.playerId,
    result: appState.editingGame.results[opp.playerId] || 'DRAW',
    bet: appState.editingGame.customBets[opp.playerId] !== undefined ? appState.editingGame.customBets[opp.playerId] : appState.editingGame.defaultBet
  }));

  const payload = {
    leaderId: appState.editingGame.leaderId,
    defaultBet: appState.editingGame.defaultBet,
    opponents: opponentPayloads,
    note: reason,
    reason: reason || 'Chỉnh sửa kết quả ván'
  };

  const btn = document.getElementById('btn-save-edit-game');
  if (btn) btn.disabled = true;

  apiClient.call('updateGame', appState.editingGame.gameId, payload)
    .then((result) => {
      showToast('Đã cập nhật ván đấu thành công!', 'success');
      closeEditGameModal();
      loadHistory();
      loadScoreboard();
    })
    .catch((err) => {
      showToast(`Lỗi sửa ván: ${err.message}`, 'error');
    })
    .finally(() => {
      if (btn) btn.disabled = false;
    });
}

// ==========================================================================
// 8. Confirm Dialog Helper & Actions (Task 4.4)
// ==========================================================================
function openConfirmModal(title, message, onConfirmCallback) {
  const modal = document.getElementById('modal-confirm');
  const tEl = document.getElementById('confirm-modal-title');
  const bEl = document.getElementById('confirm-modal-body');
  const cBtn = document.getElementById('btn-confirm-action');
  if (!modal || !bEl) return;

  if (tEl) tEl.textContent = title;
  bEl.textContent = message;

  if (cBtn) {
    cBtn.onclick = () => {
      closeConfirmModal();
      onConfirmCallback();
    };
  }

  modal.classList.add('modal-backdrop--open');
}

function closeConfirmModal() {
  const modal = document.getElementById('modal-confirm');
  if (modal) modal.classList.remove('modal-backdrop--open');
}

    () => {

function confirmRestoreGame(gameId) {

          loadHistory();

// ==========================================================================
// 9. Quick Undo Banner (Task 4.5)
// ==========================================================================
function showQuickUndo(gameId, gameNumber) {
  dismissQuickUndo(); // Clean up previous timer

  appState.quickUndo.active = true;
  appState.quickUndo.gameId = gameId;
  appState.quickUndo.gameNumber = gameNumber;
  appState.quickUndo.remainingSeconds = 8;

  const banner = document.getElementById('quick-undo-banner');
  const text = document.getElementById('quick-undo-text');
  const countSpan = document.getElementById('quick-undo-countdown');
  const progress = document.getElementById('quick-undo-progress');

  if (text) text.textContent = `Đã chốt ván #${gameNumber}`;
  if (countSpan) countSpan.textContent = '8';
  if (progress) {
    progress.style.transition = 'none';
    progress.style.width = '100%';
    setTimeout(() => {
      progress.style.transition = 'width 8s linear';
      progress.style.width = '0%';
    }, 50);
  }

  if (banner) banner.classList.add('quick-undo-banner--visible');

  // Countdown interval
  appState.quickUndo.intervalId = setInterval(() => {
    appState.quickUndo.remainingSeconds -= 1;
    if (countSpan) countSpan.textContent = String(appState.quickUndo.remainingSeconds);
    if (appState.quickUndo.remainingSeconds <= 0) {
      dismissQuickUndo();
    }
  }, 1000);

  // Auto dismiss timeout
  appState.quickUndo.timerId = setTimeout(() => {
    dismissQuickUndo();
  }, 8000);
}

function dismissQuickUndo() {
  if (appState.quickUndo.timerId) clearTimeout(appState.quickUndo.timerId);
  if (appState.quickUndo.intervalId) clearInterval(appState.quickUndo.intervalId);

  appState.quickUndo.active = false;
  appState.quickUndo.timerId = null;
  appState.quickUndo.intervalId = null;

  const banner = document.getElementById('quick-undo-banner');
  if (banner) banner.classList.remove('quick-undo-banner--visible');
}

function triggerQuickUndo() {
  if (!appState.quickUndo.active || !appState.quickUndo.gameId) return;

  const targetGameId = appState.quickUndo.gameId;
  dismissQuickUndo();

  showToast('Đang hoàn tác ván đấu...', 'info');

  apiClient.call('undoGame', targetGameId)
    .then(() => {
      showToast('Đã hoàn tác ván đấu thành công!', 'success');
      loadScoreboard();
      loadHistory();
    })
    .catch((err) => {
      showToast(`Lỗi hoàn tác: ${err.message}`, 'error');
    });
}

// ==========================================================================
// 10. Players & Settings Screens
// ==========================================================================
function loadPlayers() {
  appState.loading.players = true;
  renderPlayersView();

  apiClient.call('getPlayers', true)
    .then((data) => {
      appState.players = Array.isArray(data) ? data : [];
      appState.errors.players = null;
      populateFilterSelects();
    })
    .catch((err) => {
      console.error('Error loading players:', err);
      appState.errors.players = err.message;
    })
    .finally(() => {
      appState.loading.players = false;
      renderPlayersView();
    });
}

function renderPlayersView() {
  const container = document.getElementById('players-container');
  if (!container) return;
  container.innerHTML = '';

  const formCard = document.createElement('div');
  formCard.className = 'card';
  formCard.innerHTML = `
    <h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 10px;">Thêm người chơi mới</h3>
    <form class="form-add-player" onsubmit="event.preventDefault(); handleAddPlayer();">
      <input type="text" id="input-player-name" class="input-text" placeholder="Nhập tên người chơi..." maxlength="50" autocomplete="off">
      <button type="submit" id="btn-add-player" class="btn-secondary">+ Thêm</button>
    </form>
  `;
  container.appendChild(formCard);

  const listCard = document.createElement('div');
  listCard.className = 'card';
  listCard.innerHTML = '<h3 style="font-size: 1rem; font-weight: 700; margin-bottom: 12px;">Danh sách người chơi</h3>';

  if (appState.loading.players) {
    listCard.innerHTML += `<div class="loading-container"><div class="spinner"></div></div>`;
  } else if (!appState.players || appState.players.length === 0) {
    listCard.innerHTML += '<p class="empty-state">Chưa có người chơi nào.</p>';
  } else {
    const listWrapper = document.createElement('div');
    appState.players.forEach((p) => {
      const item = document.createElement('div');
      item.className = 'player-item';
      item.innerHTML = `
        <div>
          <strong>${escapeHtml(p.name)}</strong>
          <span style="font-size: 0.75rem; color: var(--text-muted); margin-left: 6px;">(${p.playerId})</span>
          ${!p.active ? '<span class="badge badge--inactive" style="margin-left: 6px;">Đã nghỉ</span>' : ''}
        </div>
        <div>
          ${p.active ? `
            <button type="button" style="font-size: 0.8rem; color: var(--color-danger); font-weight: 600;" onclick="handleDeactivatePlayer('${p.playerId}')">Nghỉ chơi</button>
          ` : `
            <span style="font-size: 0.8rem; color: var(--text-subtle);">Đã ngừng</span>
          `}
        </div>
      `;
      listWrapper.appendChild(item);
    });
    listCard.appendChild(listWrapper);
  }

  container.appendChild(listCard);
}

function handleAddPlayer() {
  const input = document.getElementById('input-player-name');
  if (!input) return;
  const name = input.value.trim();
  if (!name) {
    showToast('Vui lòng nhập tên người chơi', 'error');
    return;
  }

  const btn = document.getElementById('btn-add-player');
  if (btn) btn.disabled = true;

  apiClient.call('addPlayer', name)
    .then(() => {
      showToast(`Đã thêm người chơi '${name}'!`, 'success');
      input.value = '';
      loadPlayers();
      loadScoreboard();
    })
    .catch((err) => {
      showToast(err.message, 'error');
    })
    .finally(() => {
      if (btn) btn.disabled = false;
    });
}

function handleDeactivatePlayer(playerId) {
  openConfirmModal(
    'Nghỉ chơi',
    'Bạn có chắc muốn đánh dấu người chơi này nghỉ chơi? (Lịch sử điểm số vẫn được giữ nguyên)',
    () => {
      apiClient.call('deactivatePlayer', playerId)
        .then(() => {
          showToast('Đã cập nhật trạng thái người chơi', 'success');
          loadPlayers();
          loadScoreboard();
        })
        .catch((err) => {
          showToast(err.message, 'error');
        });
    }
  );
}

function handleRebuildSummary() {
  showToast('Đang đồng bộ dữ liệu...', 'info');
  apiClient.call('rebuildSummarySheet')
    .then(() => {
      showToast('Đã đồng bộ lại Bảng tổng kết thành công!', 'success');

      showToast(`Lỗi đồng bộ: ${err.message}`, 'error');

// ==========================================================================
// 11. Toast Notifications & Utilities
// ==========================================================================
function showToast(message, type = 'info', duration = 3000) {
  const container = document.getElementById('toast-container');
  if (!container) return;

  const toast = document.createElement('div');
  toast.className = `toast toast--${type}`;
  toast.setAttribute('role', 'alert');
  toast.textContent = message;

  container.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(-10px)';
    toast.style.transition = 'all 0.3s ease';
    setTimeout(() => {
      if (toast.parentNode) toast.parentNode.removeChild(toast);
    }, 300);
  }, duration);
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

// ==========================================================================
// 12. Application Bootstrap
// ==========================================================================
function initApp() {
  document.querySelectorAll('.nav-item').forEach((btn) => {
    btn.addEventListener('click', () => {
      const view = btn.dataset.view;
      if (view) navigateTo(view);
    });
  });

  const btnRefresh = document.getElementById('btn-refresh');
  if (btnRefresh) {
    btnRefresh.addEventListener('click', () => {
      showToast('Đang làm mới dữ liệu...', 'info');
      loadInitialData();
    });
  }

  loadInitialData();
}

function loadInitialData() {
  Promise.allSettled([
    apiClient.call('getAppStatus'),
    apiClient.call('getPlayers', true),
    apiClient.call('getScoreboard')
  ]).then(([statusRes, playersRes, scoreRes]) => {
    if (statusRes.status === 'fulfilled' && statusRes.value) {
      Object.assign(appState.session, statusRes.value);
      if (statusRes.value.defaultBet) {
        appState.newGame.defaultBet = statusRes.value.defaultBet;
      }
      const badge = document.getElementById('session-badge');
      if (badge) badge.textContent = appState.session.sessionName || 'Chốt Điểm';
    }

    if (playersRes.status === 'fulfilled' && Array.isArray(playersRes.value)) {
      appState.players = playersRes.value;
      populateFilterSelects();
    }

    if (scoreRes.status === 'fulfilled' && Array.isArray(scoreRes.value)) {
      appState.scoreboard = scoreRes.value;
    }

    appState.loading.app = false;
    navigateTo(appState.currentView);
  });
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
